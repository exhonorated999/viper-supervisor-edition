# electron-builder configuration — V.I.P.E.R. Supervisor Edition
#
# Local-first desktop distribution. Two Windows targets, both UNSIGNED (prototype):
#   • nsis     — installer that lets the operator choose the install directory
#                (including a USB drive) since perMachine is off.
#   • portable — a single self-contained .exe that runs from a USB stick with
#                no installation.
#
# No cloud, no auto-update feed: updates are delivered by handing over a new
# installer / portable exe. The renderer is pre-bundled into dist/ by Vite, so
# the package only needs dist + the Electron main/preload — no node_modules.
# ---------------------------------------------------------------------------

appId: com.viper.supervisoredition
productName: VIPER Supervisor Edition
copyright: Copyright © 2026 V.I.P.E.R.

directories:
  output: release

# Renderer is bundled by vite (base:"./"); main only uses Electron/Node builtins.
files:
  - dist/**/*
  - electron/**/*
  - package.json

# The LAN node ships as a single bundled CJS sidecar (scripts/build-lan-node.mjs
# → lan-dist/server.cjs) placed OUTSIDE the asar (native child processes can't
# execute from within asar). The packaged main process spawns it on launch so
# the installed app self-hosts the LAN node on 7071 — no separate `npm run lan`.
extraResources:
  - from: lan-dist/server.cjs
    to: lan-node/server.cjs

# Deterministic, offline packaging.
npmRebuild: false
electronCompile: false

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # UNSIGNED prototype: electron-updater must NOT try to verify an Authenticode
  # publisher chain (there is no cert). VIPER ships this `true` with a real cert;
  # flip back to true once a code-signing certificate is wired in.
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  perMachine: false                       # per-user → no admin needed, USB-friendly
  allowElevation: true
  allowToChangeInstallationDirectory: true # operator can install onto a USB drive
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VIPER Supervisor
  artifactName: VIPER-Supervisor-Edition-Setup-${version}.${ext}

portable:
  artifactName: VIPER-Supervisor-Edition-Portable-${version}.${ext}

# ─── Auto-update / distribution feed (mirrors Project VIPER) ───
# electron-updater consumes latest.yml + the NSIS installer from GitHub
# Releases. Publish with `npm run release` (needs a GH_TOKEN with repo scope).
# NOTE: create this repo on GitHub first — releases for Supervisor Edition must
# live in their OWN repo (sharing VIPER's repo would collide latest.yml).
publish:
  provider: github
  owner: exhonorated999
  repo: viper-supervisor-edition
  releaseType: release

